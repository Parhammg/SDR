site_name: SDR Laboratory
site_description: "Software Defined Radio Lab Documentation & Reports"
site_author: "Team-01"

theme:
  name: material
  language: en
  icon:
    logo: material/radio-tower
  font:
    text: Ubuntu
    code: Fira Code
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode (Terminal View)
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode (Lab View)
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.path
    - navigation.tracking
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

nav:
  - Home: index.md
  - 📡 Lab 1 - Spectrum Monitoring: Lab1/lab01.md
  - 📶 Lab 2 - Noise & Nonlinearity:
      - Pre-Lab Report: Lab2/prelab.md
      - Lab Report: Lab2/rf-lab02-report.md
  - 📻 Lab 3 - FM Radio & RDS:
      - Pre-Lab Report: Lab3/PreLab3.md
  - 📖 Logbook: log.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.magiclink

extra_css:
  - stylesheets/custom.css

extra_javascript:
  - javascripts/mathjax.js
  - "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js"